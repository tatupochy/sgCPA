{% extends 'base.html' %}
{% load static %}

{% block content %}
<div>
    <h1>Ingresos Totales</h1>
    <div class="d-flex gap-4 w-full flex-column justify-content-center mt-4">
        <div class="w-50">
            <select class="form-control" id="year">
                <option disabled selected>Seleccionar año</option>
                {% for year in years %}
                <option value="{{ year }}">{{ year }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="text-align-center d-flex flex-column gap-4">
            <!-- <div class="text-align-center border d-flex w-50 justify-content-between align-items-center p-2">
                <p class="m-0">Ganancia total</p>
                <span id="total_revenue"></span>
            </div> -->
            <table class="table table-bordered" id="revenues-table">
                <thead>
                    <tr>
                        <th>Mes</th>
                        <th>Ganancia</th>
                    </tr>
                </thead>
                <tbody id="revenues-table-body">

                </tbody>
                <tfoot>
                    <tr>
                        <th>Ganancia Total</th>
                        <th id="total-revenue-footer"></th>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>


<link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/1.6.2/css/buttons.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/1.6.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.print.min.js"></script>
<script src="{% static 'scripts/revenues.js' %}"></script>

<script>
    $(document).ready(function () {
    // Inicializar DataTable
    var table = $('#revenues-table').DataTable({
        dom: 'Bfrtip',
        searching: false,
        paginate: false,
        buttons: [
            'excel', 'csv',
            {
                extend: 'pdfHtml5',
                text: 'PDF',
                pageLength: 4,
                title: 'Ingresos totales',
                filename: function () {
                    var d = new Date();
                    var datestring = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) + "_" + ("0" + d.getHours()).slice(-2) + ("0" + d.getMinutes()).slice(-2);
                    return 'Ingresos totales_' + datestring;
                },
                exportOptions: {
                    columns: [0, 1]
                },
                customize: function (doc) {
                    doc.styles.tableHeader.alignment = 'left';
                    if (doc.content[1] && doc.content[1].table && doc.content[1].table.body) {
                        doc.content[1].table.widths = Array(doc.content[1].table.body[0].length + 1).join('*').split('');
                    }
                    
                    // Agregar pie de página al contenido del PDF
                    var footerRow = [
                        { text: 'Ingreso Total', bold: true },
                        { text: $('#total-revenue-footer').text(), bold: true }
                    ];
                    doc.content[1].table.body.push(footerRow);
                }
            },
        ],
        language: {
            "lengthMenu": "Mostrar _MENU_ registros por página",
            "zeroRecords": "No se encontraron resultados",
            "info": "",
            "infoEmpty": "No hay registros disponibles",
            "infoFiltered": "(filtrado de _MAX_ registros totales)",
            "search": "Buscar:",
            "paginate": {
                "first": "Primero",
                "last": "Último",
                "next": "Siguiente",
                "previous": "Anterior"
            }
        }
    });

    // Agregar el evento change al select year
    $('#year').change(async function () {
        const value = $(this).val();
        const url = `get_revenues_per_year/${value}`;

        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            const data = await response.json();
            const { monthly_revenues, total_revenue } = data;

            // Limpiar la tabla
            table.clear().draw();

            // Agregar las nuevas filas
            monthly_revenues.forEach(element => {
                table.row.add([
                    element[0],
                    parseFloat(element[1]).toFixed(0)
                ]);
            });

            // Dibujar la tabla con las nuevas filas
            table.draw();

            // Actualizar el pie de página con la ganancia total
            $('#total-revenue-footer').text(total_revenue);
        } catch (error) {
            console.error('There was a problem with the fetch operation:', error);
        }
    });
});
</script>
</script>
{% endblock %}
