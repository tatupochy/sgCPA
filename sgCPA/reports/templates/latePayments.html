{% extends 'base.html' %}
{% load static %}

{% block content %}
<div>
    <h1>Morosidad</h1>
    <div class="w-full d-flex gap-4 mb-4">
        <div class="w-50">
            <label>Año</label>
            <select class="form-control" id="yearSelector">
                <option disabled selected></option>
                {% for year in years_range %}
                <!-- <option value="{{ year }}">{{year}}</option> -->
                <option value="{{ year }}" {% if year == selected_year %}selected{% endif %}>{{ year }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="w-50">
            <label>Mes</label>
            <select class="form-control" id="monthSelector">
                <option disabled selected></option>
                <option value="1" {% if selected_month == "1" %}selected{% endif %}>Enero</option>
                <option value="2" {% if selected_month == "2" %}selected{% endif %}>Febrero</option>
                <option value="3" {% if selected_month == "3" %}selected{% endif %}>Marzo</option>
                <option value="4" {% if selected_month == "4" %}selected{% endif %}>Abril</option>
                <option value="5" {% if selected_month == "5" %}selected{% endif %}>Mayo</option>
                <option value="6" {% if selected_month == "6" %}selected{% endif %}>Junio</option>
                <option value="7" {% if selected_month == "7" %}selected{% endif %}>Julio</option>
                <option value="8" {% if selected_month == "8" %}selected{% endif %}>Agosto</option>
                <option value="9" {% if selected_month == "9" %}selected{% endif %}>Septiembre</option>
                <option value="10" {% if selected_month == "10" %}selected{% endif %}>Octubre</option>
                <option value="11" {% if selected_month == "11" %}selected{% endif %}>Noviembre</option>
                <option value="12" {% if selected_month == "12" %}selected{% endif %}>Diciembre</option>
            </select>
        </div>
    </div>
    <div class="d-flex gap-4 mb-4">
        <button class="btn btn-primary" id="filterButton">Filtrar</button>
        <button class="btn btn-primary" id="clearfilterButton">Limpiar Filtros</button>
    </div>
    <table class="table table-bordered w-full" id="debt-data-table">
        <thead>
            <tr>
                <th>Numero de cedula</th>
                <th>Nombre</th>
                <th>Deuda total</th>
                <th>Atraso</th>
            </tr>
        </thead>
        <tbody>
            {% for studentDebts in studentsDebts %}
            <tr>
                <td>{{studentDebts.ciNumber}}</td>
                <td>{{studentDebts.name}}</td>
                <td>{{studentDebts.totalDebt}}</td>
                <td>{{studentDebts.atraso}} dias</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/1.6.2/css/buttons.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/1.6.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/1.6.2/js/buttons.print.min.js"></script>
<script>
    $(document).ready(function () {

        const yearSelector = $('#yearSelector');
        const monthSelector = $('#monthSelector');

        // Mapa de nombres de los meses en español
        const monthNames = {
            1: 'Enero',
            2: 'Febrero',
            3: 'Marzo',
            4: 'Abril',
            5: 'Mayo',
            6: 'Junio',
            7: 'Julio',
            8: 'Agosto',
            9: 'Septiembre',
            10: 'Octubre',
            11: 'Noviembre',
            12: 'Diciembre'
        };

        $('#debt-data-table').DataTable({
            dom: 'Bfrtip',
            searching: false,
            buttons: [
                'excel', 'csv',
                {
                    extend: 'pdfHtml5',
                    text: 'PDF',
                    pageLength: 4,
                    title: 'Listado de alumnos morosos',
                    filename: function () {
                        let d = new Date();
                        let datestring = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) + "_" + ("0" + d.getHours()).slice(-2) + ("0" + d.getMinutes()).slice(-2);
                        return 'Listado_Alumnos_morosos_' + datestring;
                    },
                    exportOptions: {
                        columns: [0, 1, 2]
                    },
                    footer: true,
                    customize: function (doc) {
                        doc.styles.tableHeader.alignment = 'left';

                        // Ajustar el ancho de las columnas para que ocupen el 100% del ancho disponible
                        if (doc.content[1] && doc.content[1].table && doc.content[1].table.body) {
                            doc.content[1].table.widths = ['*', '*', '*']; // Ajustar el ancho de las columnas
                        }

                        doc.header = function (currentPage, pageCount) {
                            let now = new Date();
                            let formattedTime = now.getFullYear() + "-" +
                                                ("0" + (now.getMonth() + 1)).slice(-2) + "-" +
                                                ("0" + now.getDate()).slice(-2) + " " +
                                                ("0" + now.getHours()).slice(-2) + ":" +
                                                ("0" + now.getMinutes()).slice(-2);
                            return {
                                margin: [10, 10, 10, 0],
                                columns: [
                                    {
                                        text: 'sgCPA',
                                        fontSize: 18,
                                        alignment: 'start'
                                    },
                                    {
                                        text: 'Generado el: ' + formattedTime + '\n' +
                                              'Página ' + currentPage.toString() + ' de ' + pageCount,
                                        fontSize: 10,
                                        alignment: 'center'
                                    }
                                ]
                            };
                        };

                        // Verificar si se han seleccionado filtros
                        const year = yearSelector.val();
                        const month = monthSelector.val();
                        if (year || month) {
                            let filterText = 'Filtros aplicados: ';
                            if (year) {
                                filterText += 'Año: ' + year + ' ';
                            }
                            if (month) {
                                filterText += 'Mes: ' + (monthNames[month] || month);
                            }
                            // Agregar texto de filtros solo si hay algún filtro seleccionado
                            doc.content.unshift({
                                text: filterText,
                                margin: [10, 10, 10, 10]
                            });
                        }


                        let totalPages = doc.content.length - 1;


                        doc.footer = function (page, totalPages) {
                            return {
                                text: page.toString() + ' de ' + totalPages,
                                alignment: 'center'
                            };
                        };
                    }
                },
            ],
            autoWidth: true,
            language: {
                "lengthMenu": "Mostrar _MENU_ registros por página",
                "zeroRecords": "No se encontraron resultados",
                "info": "Mostrando página _PAGE_ de _PAGES_",
                "infoEmpty": "No hay registros disponibles",
                "infoFiltered": "(filtrado de _MAX_ registros totales)",
                "search": "Buscar:",
                "paginate": {
                    "first": "Primero",
                    "last": "Último",
                    "next": "Siguiente",
                    "previous": "Anterior"
                }
            }
        });
    });
</script>

<script src="{% static 'scripts/latePayments.js'  %}"></script>

<!-- <script src="{% static 'scripts/script.js' %}"></script> -->
{% endblock %}
