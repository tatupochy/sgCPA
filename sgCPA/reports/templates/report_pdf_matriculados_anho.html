<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Alumnos Matriculados por Año</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header img {
            height: 50px;
        }
        .header .date-time {
            text-align: right;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            table-layout: auto; /* Ajustar el ancho de las celdas al contenido */
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: center;
            white-space: nowrap; /* Evitar que el texto se envuelva */
        }
        th {
            background-color: #f2f2f2;
        }
        td {
            background-color: #ffffff;
        }
        .title { text-align: center; font-size: 20px; font-weight: bold; margin-top: 20px; }
        .subtitle { text-align: center; font-size: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="title">Reporte de Alumnos Matriculados por Año</div>
    <div class="subtitle">Fecha: {{ current_date }} <b>|</b> Hora: {{ current_time }}</div>
    <hr>
    <table>
        <thead>
            <tr>
                <th>Año</th>
                <th>Total de Alumnos Matriculados</th>
            </tr>
        </thead>
        <tbody>
            {% for item in data %}
            <tr>
                <td>{{ item.student_enrollment_date__year }}</td>
                <td>{{ item.total_matriculas }}</td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <td><strong>Total</strong></td>
                <td>{{ data|length }}</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
