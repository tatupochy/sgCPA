<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ranking de cursos por cantidad de ausencias</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .header { text-align: center; }
        .header img { width: 100px; }
        .title { text-align: center; font-size: 20px; font-weight: bold; margin-top: 20px; }
        .subtitle { text-align: center; font-size: 12px; margin-bottom: 20px; }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table, .table th, .table td { border: 1px solid black; }
        .table th, .table td { padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        
    </div>
    <div class="title">Ranking de cursos por cantidad de ausencias</div>
    <div class="subtitle">Fecha: {{ current_date }} | Hora: {{ current_time }}</div>
    <hr>
    <table class="table">
        <thead>
            <tr>
                <th>Curso</th>
                <th>Mes-Año</th>
                <th>Total de Ausencias</th>
            </tr>
        </thead>
        <tbody>
            {% for item in data %}
            <tr>
                <td>{{ item.attendance__course__name }}</td>
                <td>{{ item.attendance__date__month }}-{{ item.attendance__date__year }}</td>
                <td>{{ item.total_ausencias }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
