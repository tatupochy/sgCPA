{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h1>Reportes Gerenciales</h1>
    <div class="row">
        <div class="col-md-4">
            <button class="btn btn-primary w-100 mb-2" onclick="loadReport('matriculas')">Reporte de Pagos de Matrículas</button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100 mb-2" onclick="loadReport('cuotas')">Reporte de Pagos de Cuotas</button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100 mb-2" onclick="loadReport('asistencias')">Reporte de Asistencias por Curso</button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100 mb-2" onclick="loadReport('rendimiento')">Reporte de Rendimiento Académico</button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100 mb-2" onclick="loadReport('ingresos')">Reporte de Ingresos Totales</button>
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100 mb-2" onclick="loadReport('activos')">Reporte de Estudiantes Activos</button>
        </div>
    </div>
    <div id="report-container" class="mt-4"></div>
</div>

<script>
function loadReport(reportType) {
    fetch(`/reports/${reportType}/`)
        .then(response => response.text())
        .then(html => {
            document.getElementById('report-container').innerHTML = html;
        });
}
</script>
{% endblock %}
