<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Asistencias</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .chart-container {
            flex: 1 1 calc(50% - 20px); /* Two charts per row */
            max-width: calc(50% - 20px);
            min-width: 300px; /* Ensure charts are not too small */
        }
        canvas {
            width: 100% !important;
            height: auto !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard de Asistencias</h1>

        <form method="get" id="form">
            <select id="course" name="course_id" onchange="document.getElementById('form').submit()">
                <option selected disabled>Seleccione un curso</option>
                {% for course in courses %}
                    <option value="{{ course.id }}" {% if request.GET.course_id == course.id|stringformat:"s" %}selected{% endif %}>{{ course.name }}</option>
                {% endfor %}
            </select>
        </form>

        <div class="dashboard">
            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>
            <!-- Aquí puedes añadir más gráficos -->
            <div class="chart-container">
                <canvas id="anotherChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            const data = {
                labels: [
                    {% for item in data_by_month %}
                        '{{ item.month_year }}',
                    {% endfor %}
                ],
                datasets: [
                    {
                        label: 'Presentes',
                        data: [
                            {% for item in data_by_month %}
                                {{ item.present_count }},
                            {% endfor %}
                        ],
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Ausentes',
                        data: [
                            {% for item in data_by_month %}
                                {{ item.absent_count }},
                            {% endfor %}
                        ],
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    }
                ]
            };

            const attendanceChart = new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // Configuración para otro gráfico
            const anotherCtx = document.getElementById('anotherChart').getContext('2d');
            const anotherData = {
                // Tu configuración de datos para el otro gráfico
            };

            const anotherChart = new Chart(anotherCtx, {
                type: 'line', // Cambia el tipo de gráfico según tus necesidades
                data: anotherData,
                options: {
                    // Opciones del otro gráfico
                }
            });
        });
    </script>
</body>
</html>
